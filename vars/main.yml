---
# vars file for dotnet_install
dotnet_install_url: |-
  {{- dotnet_install_mirror -}}
  /v{{ dotnet_install_ver.major -}}
  /dotnet-install.{{ dotnet_install_script_type }}
dotnet_escalate: '{{ dotnet_install_role == "sys" }}'
dotnet_install_dir: |-
  {{- dotnet_install_dirs[dotnet_install_role] }}
dotnet_install_exe: |-
  {{- dotnet_install_dir -}}
  /dotnet-install-v{{ dotnet_install_ver.major -}}
  .{{- dotnet_install_script_type }}
dotnet_install_link: |-
  {{- dotnet_install_dir }}/dotnet-install.{{ dotnet_install_script_type }}
